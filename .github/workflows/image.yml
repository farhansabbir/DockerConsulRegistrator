# Builds the registrator's image - the registrator and the Consul agent in
# one - for amd64 and arm64, and pushes it to GitHub's registry:
#
#   ghcr.io/<owner>/docker-consul-registrator
#     :latest and :<commit>     from every push to main (and by hand)
#     :X.Y.Z and :X.Y           from a version tag vX.Y.Z (a pre-release,
#                               vX.Y.Z-..., as itself only)
#
# The tests, the linter and the vulnerability check pass first.
name: Image

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: make check
        run: make check

  image:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the image, on ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The version and the image's tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docker-consul-registrator"
          commit="${GITHUB_SHA::7}"
          {
            echo "image=$image"
            echo "tags<<EOF"
            if [[ $GITHUB_REF == refs/tags/v* ]]; then
              v=${GITHUB_REF_NAME#v}
              echo "$image:$v"
              [[ $v == *-* ]] || echo "$image:${v%.*}"
            else
              v=$commit
              echo "$image:latest"
              echo "$image:$commit"
            fi
            echo "EOF"
            echo "version=$v"
          } >> "$GITHUB_OUTPUT"
      - name: The binaries
        run: make dist VERSION="${{ steps.tags.outputs.version }}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=docker-consul-registrator
            org.opencontainers.image.description=Registers containers in Consul so its DNS answers A, AAAA, SRV and PTR for them
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT AND BUSL-1.1
      - name: What was pushed
        run: |
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          while read -r t; do echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"; done <<< "${{ steps.tags.outputs.tags }}"
          echo "- digest \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
