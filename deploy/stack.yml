# The registrator on every node of a Swarm, each with its Consul agent.
# deploy.sh runs it for you (docker stack deploy -c stack.yml consul) and
# names the config and secrets after their content, so a changed file
# replaces the old one; run by hand, the names end in -1.
#
#   IMAGE    the registrator's image - every node must be able to pull it
#   DOMAIN   the DNS domain to serve the services in (default: consul)
services:
  registrator:
    image: ${IMAGE:?set IMAGE to the registrator's image}
    command: ["--agent", "--token-file", "/run/secrets/registrator.token", "--domain", "${DOMAIN:-consul}"]
    networks: [hostnet]
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: agent-data
        target: /consul/data
    configs:
      - source: agent
        target: /consul/config/agent.hcl
    secrets:
      - source: agent-secrets
        target: /consul/config/secrets.hcl
        mode: 0400
      - source: registrator-token
        target: registrator.token
        mode: 0400
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

networks:
  hostnet:
    external: true
    name: host

volumes:
  agent-data:
    name: consul-agent-data # the agent's state, one per node: keeps its node ID

configs:
  agent:
    name: consul-registrator-agent-${AGENT_VERSION:-1}
    file: ./agent.hcl

secrets:
  agent-secrets:
    name: consul-registrator-agent-secrets-${SECRETS_VERSION:-1}
    file: ./secrets.hcl
  registrator-token:
    name: consul-registrator-token-${TOKEN_VERSION:-1}
    file: ./registrator.token
