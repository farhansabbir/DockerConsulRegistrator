# The registrator on every node of a Swarm, each with its Consul agent:
#
#   cp registrator.env.example registrator.env     # and fill it in
#   IMAGE=<registry>/docker-consul-registrator:<version> docker stack deploy -c stack.yml consul
#
# Everything is configured in registrator.env, read where the command runs.
# The registrator checks it before anything starts, and when something is
# missing or wrong it says what, and does not start (docker service logs
# consul_registrator). Every node must be able to pull IMAGE.
#
# Secrets can sit in registrator.env as values, or come from Swarm secrets:
# add a top-level `secrets:` entry, mount it in the service, and point the
# secret's *_FILE variable at it (CONSUL_AGENT_TOKEN_FILE=/run/secrets/...).
services:
  registrator:
    image: ${IMAGE:?set IMAGE to the image of the registrator}
    env_file: registrator.env
    networks: [hostnet]
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: agent-data
        target: /consul/data
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

networks:
  hostnet:
    external: true
    name: host

volumes:
  agent-data:
    name: consul-agent-data # the agent's state, one per node: keeps its node ID
